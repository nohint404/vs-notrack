name: CI

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax check
        run: bash -n vscode-obliterate-trackers.sh

      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning

      - name: functional test NORMAL (fake HOME, no hosts)
        run: |
          export FAKEHOME="$(mktemp -d)"
          mkdir -p "$FAKEHOME/.config/Code/User"
          echo '{"editor.fontSize": 15, "telemetry.telemetryLevel": "error"}' > "$FAKEHOME/.config/Code/User/settings.json"
          echo '{"foo": 1}' > "$FAKEHOME/.config/Code/argv.json"
          HOME="$FAKEHOME" NO_HOSTS=1 NO_PRODUCT_PATCH=1 bash vscode-obliterate-trackers.sh
          python3 - "$FAKEHOME" <<'EOF'
          import json, sys
          home = sys.argv[1]
          s = json.load(open(home + "/.config/Code/User/settings.json"))
          a = json.load(open(home + "/.config/Code/argv.json"))
          assert s["telemetry.telemetryLevel"] == "off", "telemetry non OFF"
          assert s["editor.fontSize"] == 15, "impostazioni utente cancellate!"
          assert s["workbench.cloudChanges.autoStore"] == "off"
          assert s["telemetry.feedback.enabled"] is False
          assert a["disable-telemetry"] is True and a["enable-crash-reporter"] is False
          assert "marketplace.visualstudio.com" not in json.dumps(s), "NORMAL non deve toccare lo Store"
          print("NORMAL OK")
          EOF

      - name: functional test STRICT + idempotenza
        run: |
          export FAKEHOME="$(mktemp -d)"
          mkdir -p "$FAKEHOME/.config/Code/User"
          echo '{}' > "$FAKEHOME/.config/Code/User/settings.json"
          HOME="$FAKEHOME" STRICT=1 NO_HOSTS=1 NO_PRODUCT_PATCH=1 bash vscode-obliterate-trackers.sh
          cp "$FAKEHOME/.config/Code/User/settings.json" /tmp/strict1.json
          HOME="$FAKEHOME" STRICT=1 NO_HOSTS=1 NO_PRODUCT_PATCH=1 bash vscode-obliterate-trackers.sh
          python3 - <<'EOF'
          import json
          s = json.load(open("/tmp/strict1.json"))
          assert s["extensionsGallery.serviceUrl"] == "https://open-vsx.org/vscode/gallery", "STRICT deve puntare a Open VSX"
          print("STRICT OK")
          EOF
          # idempotenza: secondo run non deve cambiare il file (a parte i backup)
          HOME="$FAKEHOME" STRICT=1 NO_HOSTS=1 NO_PRODUCT_PATCH=1 bash vscode-obliterate-trackers.sh >/dev/null
          diff /tmp/strict1.json "$FAKEHOME/.config/Code/User/settings.json" && echo "IDEMPOTENZA OK"

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell syntax check (no execution)
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\vscode-obliterate-trackers.ps1", [ref]$null, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host "PS1 SYNTAX OK"

      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path .\vscode-obliterate-trackers.ps1 -Severity Error
          if ($r) { $r | Format-Table -AutoSize; exit 1 }
          Write-Host "PSScriptAnalyzer OK"
